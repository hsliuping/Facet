name: publish-image

# 发布网关镜像到 Docker Hub（<DOCKERHUB_USERNAME>/facet）。
# 触发：手动 workflow_dispatch（发布当前 pyproject 版本）；打 v* tag 时随发布自动出镜像。
# tag 规则（版本取自 pyproject.toml）：
#   预发布 1.0.0b1 -> 1.0.0b1 + beta（不打 latest，测试版不冒充稳定版）
#   正式版 1.0.0   -> 1.0.0 + latest
# 需要 secrets：DOCKERHUB_USERNAME（命名空间，当前为 hsliup）、DOCKERHUB_TOKEN（
# Docker Hub 访问令牌，hub.docker.com → Account settings → Personal access tokens，
# 权限选 Read & Write）。未配置 TOKEN 时任务自动跳过，不影响其他流水线。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: 解析版本与浮动 tag
        id: ver
        run: |
          version=$(grep -E '^version\s*=\s*"[^"]+"' pyproject.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$version" ] || { echo "pyproject.toml 里找不到 version"; exit 1; }
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            floating=latest
          else
            floating=beta
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "floating=$floating" >> "$GITHUB_OUTPUT"
          echo "将发布 ${{ secrets.DOCKERHUB_USERNAME }}/facet:$version 与 :$floating"
      # runner 在境外：基础镜像用官方源（本地构建走 daocloud 镜像站的默认值不适用于此）
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送（linux/amd64）
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=python:3.12-slim
            NODE_IMAGE=node:22-slim
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/facet:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/facet:${{ steps.ver.outputs.floating }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
