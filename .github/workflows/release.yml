name: release

# 受控发版（dev-plan T4.8）：不再由账本变更自动发布。
# 中心管理后台点「发版」→ repository_dispatch(release_publish) → 本流水线；
# 也可以在 Actions 界面手动 workflow_dispatch。两条路径都要求在中心后台
# 先完成「打包 + verify.py 上报验证结果」，否则后台不会放行发版。
on:
  repository_dispatch:
    types: [release_publish]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（如 1.1.0），留空则用当天日期"
        required: false

jobs:
  render-sign-publish:
    # 情报账本发布流水线（dev-plan T1.3）：渲染 -> 签名 -> GitHub Release。
    # 私钥只在 CI（LEDGER_SIGNING_KEY），中心服务侧 center/pull.py 拉取后
    # 用内嵌公钥验签，任何一个字节被篡改即拒绝上线。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: resolve version
        id: ver
        run: |
          v="${{ github.event.client_payload.version }}"
          [ -z "$v" ] && v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="$(date -u +%Y.%m.%d)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema cryptography
      - name: validate ledger
        run: python tools/ledger/validate.py
      - name: render artifacts
        run: python tools/ledger/render.py --out render
      - name: sign artifacts
        env:
          LEDGER_SIGNING_KEY: ${{ secrets.LEDGER_SIGNING_KEY }}
        run: python tools/ledger/sign.py --data-dir render
      - name: build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "Facet ${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --notes-file docs/release-${{ steps.ver.outputs.version }}.md 2>/dev/null || \
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "Facet ${{ steps.ver.outputs.version }}" \
            --generate-notes
          gh release upload "v${{ steps.ver.outputs.version }}" \
            render/registry.json render/registry.json.sig \
            render/intel.json render/intel.json.sig \
            render/intel.xml \
            dist/facet_models-*.whl
          # Windows 安装包只能在 Windows 构建机产出（tools/build_windows.py），
          # 验证通过后手动 gh release upload 补传，不在 CI 里构建。
