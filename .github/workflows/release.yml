name: release

# 打 tag v* 自动出包并发布到 GitHub Releases：
#   1. 校验 tag 与 pyproject 版本一致，构建 sdist/wheel + 跑测试
#   2. windows-latest 构建 Facet-Setup-<version>.exe（含嵌入式 CPython + Chromium headless shell）
#   3. 创建/更新 GitHub Release 并挂上 exe + wheel + sdist
#   4. 配置了 PYPI_API_TOKEN 时顺带发 PyPI
# release 步骤幂等（--clobber），重跑同 tag 只覆盖资产。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验 tag 与 pyproject 版本一致
        run: |
          py="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          PY
          )"
          echo "tag=${GITHUB_REF_NAME#v} pyproject=$py"
          [ "${GITHUB_REF_NAME#v}" = "$py" ] || { echo "tag 与 pyproject.toml 版本不一致（应为 v$py）"; exit 1; }
      - name: install build tool
        run: python -m pip install build
      - name: quality gate
        run: python tools/validate_registry.py
      - name: snapshot table + build
        run: python tools/build_package.py
      - name: tests (incl. package tests)
        # 与 validate.yml 同口径：pytest（tests/web 无 playwright 自动跳过）。
        run: |
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  windows:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build-time deps（playwright / 托盘 / 图标）
        run: python -m pip install playwright pystray pillow
      - name: playwright chromium（headless shell 随包分发）
        run: python -m playwright install chromium
      - name: build installer
        run: python tools/build_windows.py
      - name: smoke（打包产物起网关：/ 判活 + /health JSON 断言）
        # dist/windows/Facet 是与 Setup.exe 同源的散装目录（build_windows.py
        # 注释明确留给冒烟）。用内嵌 CPython 首启 seed 配置；零渠道时 /health
        # 按设计返回 503 all_channels_cooling，所以判活打 /，/health 不带 -f。
        run: |
          $py  = "build/windows/Facet/runtime/python.exe"
          $app = "build/windows/Facet/app/run_gateway.py"
          $tmp = Join-Path $env:RUNNER_TEMP "facet-smoke"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $proc = Start-Process -FilePath $py `
            -ArgumentList @($app, "--config", (Join-Path $tmp "router.json"), "--port", "18787") `
            -PassThru -WindowStyle Hidden
          try {
            $up = $false
            foreach ($i in 1..30) {
              curl.exe -fsS --max-time 3 http://127.0.0.1:18787/ > $null 2>&1
              if ($LASTEXITCODE -eq 0) { $up = $true; break }
              Start-Sleep -Seconds 2
            }
            if (-not $up) { throw "打包网关未在 :18787 判活" }
            curl.exe -sS --max-time 5 http://127.0.0.1:18787/health -o "$tmp/health.json"
            python -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); print('health:', d.get('status')); assert d.get('status') in ('ok','all_channels_cooling'), d" "$tmp/health.json"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/windows/*.exe

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      # gh release view/create/upload 需要在 git 仓库内定位 repo
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist/windows/
      - name: create-or-update GitHub Release
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Facet 一键安装，免配 Python。

          | 文件 | 说明 |
          |---|---|
          | `Facet-Setup-*.exe` | Windows 安装包：内置 Python 3.11 与 Chromium headless shell，双击即用 |
          | `facet_models-*.whl` / `*.tar.gz` | pip 安装（Python ≥3.10，零运行时依赖） |

          macOS / Linux 从源码安装：克隆仓库后执行 `tools/macos/install.sh` 或
          `tools/linux/install.sh`，脚本会自动装 Python 并注册常驻服务。

          - 管理控制台首次启动生成随机密钥，只在日志打印一次（`journalctl -u facet` /
            macOS 见 `~/.facet/logs/gateway.log`），登录后可在「管理密钥」中修改。
          - Windows 安装包未代码签名：SmartScreen 提示「未知发布者」时点
            「更多信息 → 仍要运行」。
          - 旧版本：https://github.com/hsliuping/Facet/releases
          EOF
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Facet ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$tag" dist/*.whl dist/*.tar.gz dist/windows/*.exe --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: publish to PyPI
        # skipped (build-only) until the PYPI_API_TOKEN secret is configured
        # skip-existing：同版本重跑（重打 tag 验证）时 1.0.0 已在 PyPI，避免 400
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
