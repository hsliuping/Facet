name: facet-planrouter

x-build: &build
  context: .
  dockerfile: Dockerfile

services:
  # Fake upstream so `docker compose up` can exercise the whole gateway without
  # any real provider credentials. Remove this service once you use real channels.
  mock:
    image: facet-planrouter:test
    build: *build
    entrypoint: ["python", "/opt/planrouter/mock_upstream.py"]
    command: []
    environment:
      MOCK_PORT: "9000"
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  router:
    image: facet-planrouter:test
    build: *build
    depends_on:
      mock:
        condition: service_healthy
    ports:
      - "${ROUTER_PORT:-8787}:8787"
      # DSH web UI spawned by the console's "启动 DSH" entry. The entrypoint
      # binds it inside the container and advertises this host address. The
      # host side defaults to 3081 so a host-side dsh on 3080 keeps working.
      - "${DSH_PORT:-3081}:3080"
    environment:
      # Override via a .env file next to this compose.yaml for real use.
      ROUTER_API_KEY: "${ROUTER_API_KEY:-test-router-key}"
      ROUTER_ADMIN_KEY: "${ROUTER_ADMIN_KEY:-test-admin-key}"
      # Seed the mock smoke-test config on first run so this compose stack (with
      # its fake upstream) works out of the box. For real use: stop the stack,
      # delete ./data/router.json and remove this line — the next start seeds
      # the vendor-preset channels instead.
      ROUTER_SEED: "example"
      # IAM credentials for `facet-ark-quota` (Ark management plane), used by
      # the free-align sweep of the 火山引擎免费 channel. Preferred setup is
      # the console UI (channel editor renders IAM AK/SK inputs and stores
      # them in router.json); this env passthrough stays as a fallback for
      # headless deploys — UI-configured credentials win when both exist.
      VOLC_ACCESSKEY: "${VOLC_ACCESSKEY:-}"
      VOLC_SECRETKEY: "${VOLC_SECRETKEY:-}"
      # Published DSH port, so the entrypoint advertises a matching URL.
      DSH_PORT: "${DSH_PORT:-3081}"
    volumes:
      # Bind mount: config, state, usage and the audit log are visible on the
      # host at ./data/. Edit ./data/router.json and POST /api/reload (or use
      # the console). The old named volume is kept untouched as a backup.
      - ./data:/data
    restart: unless-stopped
