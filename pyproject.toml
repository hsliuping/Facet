[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "facet-models"
version = "1.0.0"
description = "Self-maintaining LLM gateway over free-tier quotas, with a bundled model facts table. Zero runtime dependencies. / 自维护的免费额度聚合网关，内置模型事实表，零运行时依赖。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Facet contributors" }]
keywords = ["llm", "model-registry", "model-selection", "ai", "facts", "gateway", "free-tier", "router"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hsliuping/Facet"

[project.scripts]
facet = "facet.cli:main"
planrouter = "facet.gateway._alias:main"  # deprecated transition alias of `facet serve`
facet-ark-quota = "facet.gateway.ark_quota:main"  # Volcengine Ark free-quota rows for the free-align sweep
facet-tokenhub-quota = "facet.gateway.tokenhub_quota:main"  # Tencent TokenHub free-trial rows for the free-align sweep
facet-siliconflow-quota = "facet.gateway.siliconflow_quota:main"  # SiliconFlow free-model rows for the free-align sweep

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facet = [
    "py.typed",
    "data/model-registry.json",
    "data/benchmarks.json",
    "data/model-scores.json",
    "data/model-coverage.json",
]
"facet.gateway" = ["static/*", "providers.json"]

[tool.pytest.ini_options]
markers = [
    "smoke: 只读冒烟用例，无副作用可并行",
    "mutating: 写配置用例，需串行执行",
]
