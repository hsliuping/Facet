[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "facet-models"
dynamic = ["version"]
description = "Self-maintaining LLM gateway over free-tier quotas, with a bundled model facts table. Zero runtime dependencies. / 自维护的免费额度聚合网关，内置模型事实表，零运行时依赖。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Facet contributors" }]
keywords = ["llm", "model-registry", "model-selection", "ai", "facts", "gateway", "free-tier", "router"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hsliuping/Facet"

[project.scripts]
facet = "facet.cli:main"
planrouter = "planrouter._alias:main"  # deprecated transition alias of `facet serve`

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facet = ["py.typed", "data/model-registry.json"]
planrouter = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "facet._version.__version__" }
